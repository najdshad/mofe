services:
  app:
    build:
      args:
        NEXT_PUBLIC_WS_URL: wss://app.mofe.ir
    environment:
      DATABASE_URL: "postgresql://mofe:mofe@db:5432/mofe"

  ordering-service:
    ports: []
    environment:
      DATABASE_URL: "postgresql://mofe:mofe@db:5432/mofe"

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro

  db:
    volumes:
      - mofe-db:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    restart: unless-stopped

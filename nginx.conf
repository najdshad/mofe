upstream nextjs {
    server app:3000;
}

upstream ordering_service {
    server ordering-service:8080;
}

# Health check endpoint for the upstream
server {
    listen 8080;
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
    location / {
        return 404;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name mofe.ir www.mofe.ir app.mofe.ir menu.mofe.ir;
    return 301 https://$host$request_uri;
}

# Landing page — mofe.ir (TLS)
server {
    listen 443 ssl http2;
    server_name mofe.ir www.mofe.ir;

    ssl_certificate     /etc/letsencrypt/live/mofe.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mofe.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /ws {
        proxy_pass http://ordering_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}


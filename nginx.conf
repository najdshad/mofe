upstream nextjs {
    server 127.0.0.1:3000;
}

# HTTP → HTTPS redirect
server {
    listen 80 default_server;
    server_name mofe.ir www.mofe.ir;
    root /var/www/html;
    index index.html;
    return 301 https://$host$request_uri;
}

# Single site — mofe.ir serves landing, dashboard, and public menus (TLS)
server {
    listen 443 ssl http2;
    server_name mofe.ir www.mofe.ir;

    ssl_certificate     /etc/letsencrypt/live/mofe.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mofe.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mofe.ir
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # D1 migrations are intentionally manual. Run `npm run db:remote` after a backup.
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare credentials are missing. Add CLOUDFLARE_API_TOKEN to repository secrets."
          fi

      - name: Deploy
        if: steps.credentials.outputs.ready == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        if: steps.credentials.outputs.ready == 'true'
        run: |
          # Cloudflare challenges GitHub runner IPs on the mofe.ir zone (403 + cf-mitigated: challenge),
          # so the deployed Worker is verified strictly through its workers.dev URL.
          for path in / /login; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "https://mofe-menu.alirezanajdshad28.workers.dev$path" > /dev/null
          done
          # The public zone must still answer; a Cloudflare challenge counts as reachable.
          for url in https://mofe.ir/ https://mofe.ir/login https://www.mofe.ir/; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 3 "$url")
            case "$code" in
              200|403) echo "$url -> $code" ;;
              *) echo "::error::$url -> $code"; exit 1 ;;
            esac
          done

      - name: Note skipped deployment
        if: steps.credentials.outputs.ready != 'true'
        run: |
          echo "### Production deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the missing Cloudflare secrets, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"

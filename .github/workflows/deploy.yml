name: Deploy to ArvanCloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.arvancloud.ir
  REGISTRY_NAMESPACE: mofe

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ArvanCloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/app:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/app:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_WS_URL=wss://app.mofe.ir
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/app:buildcache,mode=max

      - name: Build and push ordering-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ordering-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ordering-service:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ordering-service:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ordering-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/ordering-service:buildcache,mode=max

      - name: Deploy to ArvanCloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/mofe
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
            docker system prune -f

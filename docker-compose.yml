version: "3.8"

services:
  app:
    build: .
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data.db
      - ROOT_DOMAIN=mofe.ir
      - APP_DOMAIN=app.mofe.ir
      - MENU_DOMAIN=menu.mofe.ir
    volumes:
      - mofe-data:/app/data
      - mofe-uploads:/app/public/uploads
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mofe-data:
  mofe-uploads:
